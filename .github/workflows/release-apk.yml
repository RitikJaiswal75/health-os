name: Release APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'modules/**'
      - 'plugins/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'scripts/**'
      - '.github/workflows/release-apk.yml'

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Build shareable arm64 APK
        run: npm run android:apk

      - name: Copy APK to releases/
        run: |
          mkdir -p releases
          cp dist/health-os-release.apk releases/health-os-release.apk
          ls -lh releases/health-os-release.apk

      - name: Commit APK to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/health-os-release.apk
          git diff --staged --quiet || git commit -m "chore: update releases/health-os-release.apk for v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Health OS v${{ steps.version.outputs.version }}
          body: |
            Direct-download arm64 APK for sideloading (no Play Store).

            - Install from the **health-os-release.apk** asset below
            - Or download from [`releases/health-os-release.apk`](https://github.com/${{ github.repository }}/blob/main/releases/health-os-release.apk) on `main`

            Bump `version` in `app.json` before pushing to publish a new GitHub Release tag.
          files: releases/health-os-release.apk
          generate_release_notes: true
          make_latest: true
