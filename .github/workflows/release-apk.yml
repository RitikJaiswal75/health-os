name: Release APK

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'src/**'
      - 'modules/**'
      - 'plugins/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'expo.base.json'
      - 'app.config.js'
      - 'scripts/**'
      - '.github/workflows/release-apk.yml'

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3 defaulted to deprecated `tools`, which Google removed from sdkmanager.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./expo.base.json').expo.version")" >> "$GITHUB_OUTPUT"

      # Release APKs must not use the public debug key, or anyone could sign an "update" over them.
      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::ANDROID_RELEASE_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release."
              exit 1
            fi
            echo "::warning::No release keystore secret; this branch APK is debug-signed (artifact only)."
            exit 0
          fi
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build shareable arm64 APK
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Without a token, skip source map upload instead of failing the build.
          # Branch builds never upload source maps, so they do not pollute Sentry releases.
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ (github.ref != 'refs/heads/main' || secrets.SENTRY_AUTH_TOKEN == '') && 'true' || 'false' }}
        run: npm run android:apk

      # Every push gets a downloadable APK from the run page (Actions > run > Artifacts).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: health-os-apk-${{ github.sha }}
          path: dist/health-os-release.apk
          retention-days: 14
          if-no-files-found: error

      # Only main publishes a GitHub Release.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Health OS v${{ steps.version.outputs.version }}
          body: |
            Direct-download arm64 APK for sideloading (no Play Store).

            Download **health-os-release.apk** from the assets below and install on your phone.
            If installing over v2.1.0 or older fails, uninstall the old app first (the signing key changed).

            Bump `version` in `expo.base.json` before pushing to publish a new GitHub Release tag.
          files: dist/health-os-release.apk
          generate_release_notes: true
          make_latest: true
