name: Deploy app config

on:
  push:
    branches: [main]
    paths:
      - 'workers/app-config/**'
      - 'src/features/appUpdate/**'
      - 'src/core/remoteConfig/**'
      - 'src/core/observability/configSchema.ts'
      - '.github/workflows/deploy-app-config.yml'

permissions:
  contents: read

concurrency:
  group: deploy-app-config
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/app-config/package-lock.json

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          base: ${{ github.event.before }}
          filters: |
            worker:
              - 'workers/app-config/src/**'
              - 'workers/app-config/wrangler.toml'
              - 'workers/app-config/package.json'
              - 'workers/app-config/package-lock.json'
              - 'src/features/appUpdate/**'
              - 'src/core/remoteConfig/**'
              - 'src/core/observability/configSchema.ts'
            appUpdateConfig:
              - 'workers/app-config/config/app-update.json'

      - name: Install worker dependencies
        working-directory: workers/app-config
        run: npm ci

      - name: Deploy worker
        if: steps.changes.outputs.worker == 'true'
        working-directory: workers/app-config
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write app-update config to KV
        if: steps.changes.outputs.appUpdateConfig == 'true'
        working-directory: workers/app-config
        run: npm run config:set -- config/app-update.json --kind app-update --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify served config matches committed file
        if: steps.changes.outputs.worker == 'true' || steps.changes.outputs.appUpdateConfig == 'true'
        run: npx --yes tsx@4 scripts/verify-app-update-deploy.ts
