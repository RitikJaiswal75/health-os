name: Deploy India catalog

on:
  push:
    branches: [main]
    paths:
      - 'workers/india-catalog/src/**'
      - 'workers/india-catalog/migrations/**'
      - 'workers/india-catalog/wrangler.toml'
      - 'workers/india-catalog/package.json'
      - 'workers/india-catalog/package-lock.json'
      - '.github/workflows/deploy-india-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-india-catalog
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/india-catalog
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/india-catalog/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      # Schema first, so the new code never runs against an old schema. Applies only new
      # migrations/*.sql files (D1 tracks applied ones). Catalog data (seed/) is not in git:
      # reseed by hand with `npm run d1:seed:remote`.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply health-os-india-catalog --remote

      - name: Deploy worker
        run: npx wrangler deploy

      # /search hits D1 and returns 503 on a query failure, so this checks the database too.
      - name: Smoke test
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /tmp/search.json -w '%{http_code}' 'https://drugs.healthos.ritik.cc/search?q=dolo&limit=1')
            if [ "$status" = "200" ] && grep -q '"results":\[{' /tmp/search.json; then
              echo "Search OK"; exit 0
            fi
            echo "Attempt $attempt: HTTP $status"; sleep 10
          done
          echo "::error::India catalog search failed after deploy"; exit 1
