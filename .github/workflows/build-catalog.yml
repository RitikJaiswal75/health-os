name: Build India Catalog

on:
  push:
    branches: [main]
    paths:
      - 'data/indian_medicine_data.json'
      - 'scripts/ingest-cdci.ts'
      - 'src/features/catalog/indiaMedicineParser.ts'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build india.db from JSON
        run: CDCI_SOURCE=data/indian_medicine_data.json npm run ingest-cdci

      - name: Commit catalog artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/india.db data/catalog-version.json
          if git diff --staged --quiet; then
            echo "No catalog changes to commit"
            exit 0
          fi
          git commit -m "chore: rebuild India medicine catalog [skip ci]"
          git push
